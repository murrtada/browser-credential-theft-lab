name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libnss3 (Firefox NSS fixtures)
        run: sudo apt-get update && sudo apt-get install -y libnss3

      - name: Install pycryptodome (Chrome/Edge crypto path)
        run: python -m pip install "pycryptodome>=3.19"

      - name: Compile check (all Python sources + tests)
        run: python -m py_compile creds_dumper.py lib/*.py tests/*.py

      - name: Run CI-safe test suites
        run: |
          python tests/test_chrome_crypto.py
          python tests/test_chrome_profiles.py
          python tests/test_nss.py
